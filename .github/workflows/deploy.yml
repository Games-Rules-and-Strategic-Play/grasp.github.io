name: Build and Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install mkdocs-material mkdocs-bibtex

      - name: Build site
        run: mkdocs build

      - name: Deploy to Web Root
        run: |
          # Remove old content
          rm -rf /var/www/grasp-lab/*
          
          # Copy new site files
          cp -r site/* /var/www/grasp-lab/