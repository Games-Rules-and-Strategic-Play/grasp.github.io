name: Deploy GRASP to GitHub Pages

on:
  push:
    branches:
      - main

# This gives the Action permission to push the compiled website back to your repo
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install MkDocs and Material Theme
        run: pip install mkdocs-material
        
      # This single command builds the site and pushes it to a hidden 'gh-pages' branch
      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force