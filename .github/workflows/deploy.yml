name: Deploy GRASP to Web Server

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted  # Ensure this matches your runner label
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install MkDocs and Plugins
        run: pip install mkdocs-material mkdocs-bibtex
        
      - name: Build Site
        run: mkdocs build
        
      - name: Deploy to Web Root
        run: |
          # Remove old site files and copy new ones
          rm -rf /var/www/grasp-lab/*
          cp -r site/* /var/www/grasp-lab/